<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Arial, sans-serif">
<rect width="1920" height="1080" fill="#fff"/>
<text x="960" y="105" font-size="56" font-weight="700" text-anchor="middle" fill="#1f2328">Incremental learning (fine-tune): hướng thực hiện</text>
<text x="960" y="170" font-size="32" text-anchor="middle" fill="#5b6470">Từ mô hình đã train trên OpTC, học thêm dữ liệu mới mà không train lại từ đầu</text>
<rect x="18" y="330" width="340" height="360" rx="28" fill="#d6ecdc" stroke="#14532d" stroke-width="4"/>
<circle cx="188" cy="330" r="36" fill="#14532d"/><text x="188" y="345" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="188" y="428" font-size="38" font-weight="700" text-anchor="middle" fill="#14532d">Mô hình gốc</text>
<text x="188" y="490" font-size="26" text-anchor="middle" fill="#1f2328">Đã train trên OpTC</text>
<text x="188" y="536" font-size="26" text-anchor="middle" fill="#1f2328">(BiLSTM, Mixed-Type)</text>
<path d="M362 510 L390 510" stroke="#2f5fb3" stroke-width="7"/><path d="M400 510 L382 495 L382 525Z" fill="#2f5fb3"/>
<rect x="404" y="330" width="340" height="360" rx="28" fill="#dbe8fb" stroke="#1b3d73" stroke-width="4"/>
<circle cx="574" cy="330" r="36" fill="#1b3d73"/><text x="574" y="345" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="574" y="428" font-size="38" font-weight="700" text-anchor="middle" fill="#1b3d73">Mở rộng từ điển</text>
<text x="574" y="490" font-size="26" text-anchor="middle" fill="#1f2328">Thêm token mới của</text>
<text x="574" y="536" font-size="26" text-anchor="middle" fill="#1f2328">THEIA, ATLASv2</text>
<path d="M748 510 L776 510" stroke="#2f5fb3" stroke-width="7"/><path d="M786 510 L768 495 L768 525Z" fill="#2f5fb3"/>
<rect x="790" y="330" width="340" height="360" rx="28" fill="#fdf0c7" stroke="#6b4e00" stroke-width="4"/>
<circle cx="960" cy="330" r="36" fill="#6b4e00"/><text x="960" y="345" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="960" y="428" font-size="38" font-weight="700" text-anchor="middle" fill="#6b4e00">Đầu vào</text>
<text x="960" y="490" font-size="26" text-anchor="middle" fill="#1f2328">5 trường chuẩn hóa:</text>
<text x="960" y="536" font-size="26" text-anchor="middle" fill="#1f2328">app_family, proto,</text>
<text x="960" y="582" font-size="26" text-anchor="middle" fill="#1f2328">resp_port_class,</text>
<text x="960" y="628" font-size="26" text-anchor="middle" fill="#1f2328">image_dir_class, delta_t</text>
<path d="M1134 510 L1162 510" stroke="#2f5fb3" stroke-width="7"/><path d="M1172 510 L1154 495 L1154 525Z" fill="#2f5fb3"/>
<rect x="1176" y="330" width="340" height="360" rx="28" fill="#dbe8fb" stroke="#1b3d73" stroke-width="4"/>
<circle cx="1346" cy="330" r="36" fill="#1b3d73"/><text x="1346" y="345" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text x="1346" y="428" font-size="38" font-weight="700" text-anchor="middle" fill="#1b3d73">Fine-tune</text>
<text x="1346" y="490" font-size="26" text-anchor="middle" fill="#1f2328">Học thêm trên dữ liệu mới</text>
<text x="1346" y="536" font-size="26" text-anchor="middle" fill="#1f2328">(tốc độ học nhỏ)</text>
<path d="M1520 510 L1548 510" stroke="#2f5fb3" stroke-width="7"/><path d="M1558 510 L1540 495 L1540 525Z" fill="#2f5fb3"/>
<rect x="1562" y="330" width="340" height="360" rx="28" fill="#e6dcf7" stroke="#43266f" stroke-width="4"/>
<circle cx="1732" cy="330" r="36" fill="#43266f"/><text x="1732" y="345" font-size="44" font-weight="700" text-anchor="middle" fill="#fff">5</text>
<text x="1732" y="428" font-size="38" font-weight="700" text-anchor="middle" fill="#43266f">Đánh giá</text>
<text x="1732" y="490" font-size="26" text-anchor="middle" fill="#1f2328">F1 trên THEIA, ATLASv2</text>
<text x="1732" y="536" font-size="26" text-anchor="middle" fill="#1f2328">F1 trên OpTC</text>
<text x="1732" y="582" font-size="26" text-anchor="middle" fill="#1f2328">(có bị quên không)</text>
<path d="M960 696 L960 770" stroke="#2f5fb3" stroke-width="6"/><path d="M960 694 L946 720 L974 720Z" fill="#2f5fb3"/>
<rect x="526" y="770" width="190" height="70" rx="18" fill="#fff" stroke="#2f5fb3" stroke-width="3"/><text x="621" y="815" font-size="30" font-weight="700" text-anchor="middle" fill="#2f5fb3">THEIA</text>
<rect x="740" y="770" width="210" height="70" rx="18" fill="#fff" stroke="#2f5fb3" stroke-width="3"/><text x="845" y="815" font-size="30" font-weight="700" text-anchor="middle" fill="#2f5fb3">ATLASv2</text>
<rect x="974" y="770" width="420" height="70" rx="18" fill="#fff" stroke="#2f5fb3" stroke-width="3"/><text x="1184" y="815" font-size="30" font-weight="700" text-anchor="middle" fill="#2f5fb3">OpTC (một phần, replay)</text>
<text x="960" y="890" font-size="28" text-anchor="middle" fill="#5b6470">dữ liệu mới + một phần OpTC để không quên</text>
</svg>