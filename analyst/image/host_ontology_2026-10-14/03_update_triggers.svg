<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">3  /  Proposed model-update triggers</title>
<desc id="desc">Review turns uncertain evidence into confirmed labels • updates are gated, versioned and evaluated. No continual-learning or open-set performance is claimed by the current cascade result. Trigger thresholds and budgets require validation.</desc>
