# KLTN central stack, IL3 deployment (General Architecture, CENTRAL VM). Project name kltn-il3: new volumes, the
# volumes of the earlier pilot (kltn-central_*) are left untouched.
name: kltn-il3
x-app: &app
  image: kltn-central:il3
  network_mode: host
  restart: unless-stopped
  mem_limit: 384m
  cpus: 0.5
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - ../runtime/secrets.json:/run/kltn/secrets.json:ro
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  nats:
    image: nats:2.11-alpine
    network_mode: host
    command: ['-c', '/etc/nats/nats.conf']
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ../runtime/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    logging:
      options: {max-size: 10m, max-file: '3'}
  postgres:
    image: postgres:17-alpine
    network_mode: host
    command: ['postgres', '-c', 'listen_addresses=127.0.0.1', '-p', '15432', '-c', 'shared_buffers=256MB', '-c', 'max_connections=60']
    environment:
      POSTGRES_USER: kltn
      POSTGRES_DB: kltn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ../runtime/postgres-password:/run/secrets/postgres_password:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 15432 -U kltn -d kltn']
      interval: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging:
      options: {max-size: 10m, max-file: '3'}
  api:
    <<: *app
    environment:
      # closed research lab (owner's decision 2026-11-14): the requester may approve their own response request.
      # Use two_person for any shared deployment. Network actions still require a confirmed SOC review.
      KLTN_APPROVAL_POLICY: single_operator
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz',timeout=3)"]
      interval: 5s
      retries: 20
  archiver:
    <<: *app
    command: ['python', '-u', 'worker.py']
    depends_on:
      api: {condition: service_healthy}
  normalizer:
    <<: *app
    command: ['python', '-u', 'normalizer.py']
    mem_limit: 768m
    depends_on:
      api: {condition: service_healthy}
  framework:
    <<: *app
    command: ['python', '-u', 'framework_worker.py']
    depends_on:
      api: {condition: service_healthy}
  dl-worker:
    image: kltn-dl:il3
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 2
    environment:
      KLTN_DL_BUNDLE: /models/current
      KLTN_DL_THREADS: '2'
    volumes:
      - ../runtime/dl.json:/run/kltn/dl.json:ro
      - ../runtime/models/dl:/models:ro
    depends_on:
      postgres: {condition: service_healthy}
      normalizer: {condition: service_started}
    healthcheck:
      test: ['CMD', 'python', '-c', "import json,time; d=json.load(open('/tmp/dl-health.json')); assert time.time()-d['updated_at'] < 90"]
      interval: 20s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging:
      options: {max-size: 10m, max-file: '3'}
  mlflow:
    image: kltn-mlflow:il3
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    env_file: ../runtime/mlflow.env
    command: ['mlflow', 'server', '--host', '127.0.0.1', '--port', '15000', '--workers', '1',
              '--artifacts-destination', '/mlflow/artifacts', '--serve-artifacts']
    volumes:
      - ../runtime/mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2.10-alpine
    network_mode: host
    volumes:
      - ../runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../runtime/tls:/tls:ro
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    logging:
      options: {max-size: 10m, max-file: '3'}
    depends_on:
      api: {condition: service_healthy}
volumes:
  nats-data:
  postgres-data:
