---
# Explicit rollout playbook. Example:
# ansible-playbook deploy-host-model.yml -e host_model_bundle=/absolute/release/path
- name: Validate the immutable Host ML release on the controller
  hosts: windows
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require an explicit controller bundle path
      ansible.builtin.assert:
        that:
          - host_model_bundle is defined
          - host_model_bundle | length > 0
    - name: Verify hashes, branch, parity and domain eligibility
      ansible.builtin.command:
        argv:
          - python3
          - '{{ playbook_dir }}/../scripts/verify_model_bundle.py'
          - '{{ host_model_bundle }}'
          - --branch
          - host_ml
          - --require-eligible
      delegate_to: localhost
      become: false
      changed_when: false
      run_once: true
    - name: Read the verified manifest
      ansible.builtin.set_fact:
        host_bundle_manifest: "{{ lookup('ansible.builtin.file', host_model_bundle ~ '/manifest.json') | from_json }}"
  tasks:
    - name: Create immutable release directory
      ansible.windows.win_file:
        path: 'C:\KLTN\agent\models\releases\{{ host_bundle_manifest.bundle_id }}'
        state: directory
    - name: Copy verified release bytes
      ansible.windows.win_copy:
        src: '{{ host_model_bundle }}/'
        dest: 'C:\KLTN\agent\models\releases\{{ host_bundle_manifest.bundle_id }}\'
    - name: Point configuration to the shadow release
      ansible.windows.win_template:
        src: roles/endpoint_agent/templates/agent.json.j2
        dest: C:\KLTN\agent\config.json
      vars:
        agent_database: 'C:\KLTN\agent\state\inbox.sqlite'
        agent_bundle_path: 'C:\KLTN\agent\models\releases\{{ host_bundle_manifest.bundle_id }}'
        agent_mode: ready_shadow
      no_log: true
      notify: Restart rolled out Windows agent
    - name: Apply model configuration
      ansible.builtin.meta: flush_handlers
    - name: Require checksum-gated readiness
      ansible.windows.win_uri:
        url: http://127.0.0.1:18081/readyz
        return_content: true
        url_timeout: 30
        use_proxy: false
      register: ready
      until: ready.status_code == 200
      retries: 12
      delay: 5
    - name: Assert the expected immutable bundle is loaded
      ansible.builtin.assert:
        that:
          - (ready.content | from_json).bundle_id == host_bundle_manifest.bundle_id
          - (ready.content | from_json).inference == 'ready_shadow'
  handlers:
    - name: Restart rolled out Windows agent
      ansible.windows.win_service:
        name: kltn-agent
        state: restarted
