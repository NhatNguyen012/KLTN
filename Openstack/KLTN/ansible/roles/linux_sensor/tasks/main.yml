---
- name: Install native audit and repository prerequisites
  ansible.builtin.apt:
    name: [auditd, audispd-plugins, ca-certificates, gpg]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
- name: Trust Fluent Bit package signing key
  ansible.builtin.get_url:
    url: https://packages.fluentbit.io/fluentbit.key
    dest: /usr/share/keyrings/fluentbit.asc
    mode: '0644'
- name: Configure Fluent Bit repository
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/fluentbit.asc] https://packages.fluentbit.io/ubuntu/noble noble main'
    filename: fluent-bit
- name: Install Fluent Bit
  ansible.builtin.apt:
    name: fluent-bit
    state: present
    lock_timeout: 600
- name: Create private telemetry directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: [/var/lib/kltn, /var/lib/kltn/buffer, /var/lib/kltn/workload]
- name: Install ingest TLS trust
  ansible.builtin.copy:
    src: '{{ runtime_dir }}/tls/server.crt'
    dest: /etc/fluent-bit/kltn-ca.crt
    mode: '0644'
  notify: Restart Fluent Bit
- name: Configure audit rotation
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
  loop:
    - {key: max_log_file, value: '50'}
    - {key: num_logs, value: '8'}
    - {key: max_log_file_action, value: ROTATE}
  notify: Reload audit daemon
- name: Install the SL700 audit policy (bfuzzy/auditd-attack @41d8a13; the Linux models were trained on it)
  ansible.builtin.copy:
    src: kltn.rules
    dest: /etc/audit/rules.d/kltn.rules
    mode: '0600'
  notify: Load audit rules
- name: Look up the endpoint agent account (its own connections are not audited)
  ansible.builtin.getent:
    database: passwd
    key: kltn-agent
    fail_key: false
- name: Exclude the telemetry pipeline's own connections from audit (feedback loop)
  ansible.builtin.template:
    src: kltn-sensor.rules.j2
    dest: /etc/audit/rules.d/zz-kltn-sensor.rules
    mode: '0600'
  notify: Load audit rules
- name: Enable audit daemon
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
- name: Check that the kernel runs the installed audit rules
  ansible.builtin.command: augenrules --check
  register: augenrules_check
  changed_when: "'No change' not in augenrules_check.stdout"
- name: Load the audit rules (a failed earlier run can leave the handler unflushed)
  ansible.builtin.command: augenrules --load
  when: augenrules_check.changed
- name: Assert the SL700 rule set is active
  ansible.builtin.shell: auditctl -l | grep -cE -- '(-k |key=)'
  register: audit_rules
  changed_when: false
  failed_when: audit_rules.stdout | int < 200
- name: Assert the pipeline exclusion is evaluated before the SL700 connect rule
  ansible.builtin.shell: set -o pipefail; auditctl -l | grep -E -- '-S connect' | head -1
  args:
    executable: /bin/bash
  register: first_connect_rule
  changed_when: false
  failed_when: "'never' not in first_connect_rule.stdout"
- name: Configure Fluent Bit TLS delivery
  ansible.builtin.template:
    src: fluent-bit.conf.j2
    dest: /etc/fluent-bit/fluent-bit.conf
    mode: '0600'
  no_log: true
  notify: Restart Fluent Bit
- name: Enable Fluent Bit
  ansible.builtin.systemd_service:
    name: fluent-bit
    enabled: true
    state: started
